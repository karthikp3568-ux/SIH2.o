[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The URL is read from DATABASE_URL at runtime by alembic/env.py; this value is
# only a placeholder so the CLI does not complain when the variable is unset.
sqlalchemy.url = sqlite:///./livelihood_navigator.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
